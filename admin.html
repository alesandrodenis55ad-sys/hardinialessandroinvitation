<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Undangan</title>
    <style>
        body { font-family: 'Lato', sans-serif; padding: 2rem; background: #FDFBF7; color: #3E352B; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 150px; padding: 1rem; border: 1px solid #D4C4B7; border-radius: 4px; margin-bottom: 1rem; font-family: inherit; }
        button { background: #3E352B; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #6B6154; }
        table { width: 100%; margin-top: 2rem; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #D4C4B7; text-align: left; }
        th { background: #f9f9f9; }
        a { color: #6B6154; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Buat Link Undangan Personal</h2>
        <p>Tempel daftar nama tamu di bawah ini (satu baris untuk satu nama):</p>
        <textarea id="guest-input" placeholder="Contoh:&#10;Ahnaf dan Pasangan&#10;Andi dan Keluarga"></textarea>
        <button id="btn-generate">Buat Tautan</button>

        <table id="result-table" style="display: none;">
            <thead>
                <tr>
                    <th>Nama Tamu</th>
                    <th>Link Personal</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="result-body"></tbody>
        </table>
    </div>

    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
